name: Keep Supabase Alive

on:
  schedule:
    # Dijalankan setiap hari Senin & Kamis jam 00:00 UTC
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Agar bisa dites jalan manual kapan saja

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
