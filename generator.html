<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900 text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Serial Key Generator - Kartu Stok Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-full flex items-center justify-center p-4 antialiased">
  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-5">
    <div class="text-center space-y-1">
      <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto text-xl text-amber-300 shadow-md">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight pt-2">KEY GENERATOR</h1>
      <p class="text-xs text-slate-400">Panel Khusus Developer / Lisensi Sistem</p>
    </div>

    <div class="space-y-4 pt-2">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">MASUKKAN NAMA TOKO KLIEN:</label>
        <input type="text" id="storeInput" oninput="generateKey()" placeholder="CONTOH: TOKO SEMBAKO JAYA" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-white uppercase tracking-wide focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-amber-400 mb-1">SERIAL KEY HASIL GENERATE:</label>
        <div class="flex space-x-2">
          <input type="text" id="resultKey" readonly value="----" class="w-full p-3 bg-slate-950 border border-amber-500/50 rounded-xl text-center font-mono font-bold text-amber-300 text-base tracking-widest outline-none">
          <button onclick="copyKey()" class="px-4 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-copy"></i>
            <span>Salin</span>
          </button>
        </div>
      </div>
    </div>

    <div class="border-t border-slate-700/60 pt-4 text-center text-[11px] text-slate-500">
      Sistem Kartu Stok Enterprise &copy; Developer Panel
    </div>
  </div>

  <script>
    const SECRET_SALT = "NINNA_KARTUSTOK_SECRET_2026";

    function generateLicenseKey(storeName) {
      const str = (storeName || '').toUpperCase().trim() + SECRET_SALT;
      let h1 = 0, h2 = 0;
      for (let i = 0; i < str.length; i++) {
        let ch = str.charCodeAt(i);
        h1 = ((h1 << 5) - h1) + ch; h1 |= 0;
        h2 = ((h2 << 7) - h2) + ch; h2 |= 0;
      }
      const hex1 = Math.abs(h1).toString(16).toUpperCase().padStart(8, '9');
      const hex2 = Math.abs(h2).toString(16).toUpperCase().padStart(8, '7');
      const combined = (hex1 + hex2).slice(0, 16);
      return `${combined.slice(0,4)}-${combined.slice(4,8)}-${combined.slice(8,12)}-${combined.slice(12,16)}`;
    }

    function generateKey() {
      const val = document.getElementById('storeInput').value;
      document.getElementById('resultKey').value = val.trim() ? generateLicenseKey(val) : '----';
    }

    function copyKey() {
      const keyInput = document.getElementById('resultKey');
      if(keyInput.value === '----') return;
      keyInput.select();
      navigator.clipboard.writeText(keyInput.value);
      alert('Serial Key berhasil disalin!');
    }
  </script>
</body>
</html>
